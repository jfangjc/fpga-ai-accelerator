# /etc/default/stt-caption: settings for the stt-caption service.
# Apply changes with: sudo systemctl restart stt-caption

# Microphone: 1 = PMOD I2S1 (pin 4 data), 2 = I2S2 (pin 3 data), beam = 2-mic beamformer.
# The receiver reads the left I2S slot (microphone L/R select pin tied low).
MIC=1
# Software gain applied to microphone band power before the log (dB). 20 dB
# brings a desk-distance MEMS microphone near the LibriSpeech level assumed by
# the running-normalisation prior. Finals are insensitive to it.
MIC_GAIN_DB=20
# Speech detection: frame energy must exceed the tracked noise floor by this (dB).
VAD_SNR_DB=8
# TCP caption stream (line-delimited JSON) for PC clients: tools/caption_client.py.
PORT=8765
# Inference: pl = FPGA engine (default), cpu = A53 INT8 fallback.
BACKEND=pl
# Finals: auto = FPGA for phrases up to 6.4 s, CPU worker for longer ones.
FINAL_BACKEND=auto
THREADS=3
# Session logs on the SD card.
SESSIONS=/var/lib/stt-caption/sessions
KEEP_SESSIONS=20
# Extra sttcap options, for example: EXTRA_ARGS="--vad-log vad.csv"
EXTRA_ARGS=
