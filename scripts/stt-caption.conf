# stt-caption settings; apply with sudo systemctl restart stt-caption
# Microphone gain
MIC_GAIN_DB=20
# Caption stream port
PORT=8765
# Captions on the monitor: yes or no
DISPLAY_CAPTIONS=yes
# A status strip under the captions (listening or speaking, decode time, caption delay): yes or no
DISPLAY_STATUS=yes
# Clear the screen after this many seconds of silence; 0 keeps the captions on screen
CLEAR_AFTER=5
# Screen colours: butter (pastel yellow, matches the poster) or night (dark, easier on the eyes for long viewing)
THEME=butter
# Previews that must agree before a word turns settled (dark) and stays settled: 2-8; 0 = the old rule
SETTLE=3
